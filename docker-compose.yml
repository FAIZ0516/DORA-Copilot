services:
  postgres:
    image: postgres:16-alpine
    container_name: dora-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dora}
      POSTGRES_DB: ${POSTGRES_DB:-dora_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dora} -d ${POSTGRES_DB:-dora_dashboard}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dora_postgres_data:

